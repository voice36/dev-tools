<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开发者与办公极速在线工具箱 - JSON格式化|Base64|时间戳|文本处理</title>
    <meta name="description" content="免费高效的程序员与日常办公在线小工具箱，提供JSON格式化校验、Base64加解密、Unix时间戳转换、文本字数统计与去重等功能。纯前端处理，安全不上传。">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen">

    <!-- 顶部导航 -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                <span class="text-xl font-bold tracking-wide">极速开发者工具箱</span>
            </div>
            <div class="text-xs sm:text-sm space-x-3">
                <button onclick="openModal('aboutModal')" class="hover:underline">关于本站</button>
                <button onclick="openModal('privacyModal')" class="hover:underline">隐私政策</button>
            </div>
        </div>
    </header>

    <!-- 工具选项卡导航 -->
    <div class="bg-white border-b shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-2 flex overflow-x-auto text-sm font-medium text-gray-600 no-scrollbar">
            <button onclick="switchTab('json')" id="tab-json" class="tab-btn py-3 px-5 border-b-2 border-blue-600 text-blue-600 whitespace-nowrap">JSON 格式化/校验</button>
            <button onclick="switchTab('base64')" id="tab-base64" class="tab-btn py-3 px-5 border-b-2 border-transparent hover:text-blue-600 whitespace-nowrap">Base64 编解码</button>
            <button onclick="switchTab('timestamp')" id="tab-timestamp" class="tab-btn py-3 px-5 border-b-2 border-transparent hover:text-blue-600 whitespace-nowrap">时间戳转换</button>
            <button onclick="switchTab('text')" id="tab-text" class="tab-btn py-3 px-5 border-b-2 border-transparent hover:text-blue-600 whitespace-nowrap">文本统计与去重</button>
        </div>
    </div>

    <!-- 主体内容 -->
    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- 1. JSON 格式化工具 -->
        <section id="panel-json" class="tab-panel bg-white p-6 rounded-xl shadow-sm space-y-4">
            <h1 class="text-xl font-bold text-gray-800">JSON 格式化与语法校验器</h1>
            <textarea id="jsonInput" class="w-full h-56 p-3 border rounded-lg font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="请在此粘贴压缩或未格式化的 JSON 字符串..."></textarea>
            <div class="flex flex-wrap gap-2">
                <button onclick="formatJSON()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 font-medium">格式化 / 美化</button>
                <button onclick="compressJSON()" class="bg-gray-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-700 font-medium">压缩单行</button>
                <button onclick="copyText('jsonInput')" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700 font-medium">复制结果</button>
                <button onclick="clearField('jsonInput', 'jsonMsg')" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600 font-medium">清空</button>
            </div>
            <p id="jsonMsg" class="text-sm font-semibold"></p>
        </section>

        <!-- 2. Base64 编解码工具 -->
        <section id="panel-base64" class="tab-panel hidden bg-white p-6 rounded-xl shadow-sm space-y-4">
            <h1 class="text-xl font-bold text-gray-800">Base64 文本编码与解码器</h1>
            <textarea id="base64Input" class="w-full h-44 p-3 border rounded-lg font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="输入需要处理的文本或 Base64 字符..."></textarea>
            <div class="flex flex-wrap gap-2">
                <button onclick="encodeBase64()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 font-medium">编码 (Encode)</button>
                <button onclick="decodeBase64()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700 font-medium">解码 (Decode)</button>
                <button onclick="copyText('base64Input')" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700 font-medium">复制结果</button>
                <button onclick="clearField('base64Input', 'base64Msg')" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600 font-medium">清空</button>
            </div>
            <p id="base64Msg" class="text-sm font-semibold"></p>
        </section>

        <!-- 3. 时间戳转换工具 -->
        <section id="panel-timestamp" class="tab-panel hidden bg-white p-6 rounded-xl shadow-sm space-y-6">
            <h1 class="text-xl font-bold text-gray-800">Unix 时间戳转换器</h1>
            
            <div class="p-4 bg-blue-50 rounded-lg flex flex-col sm:flex
