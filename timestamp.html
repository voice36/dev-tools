<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unix 时间戳在线转换器 - 极速在线工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">极速在线工具箱</a>
            <div class="text-xs sm:text-sm space-x-2 overflow-x-auto">
                <a href="json.html" class="hover:underline">JSON</a>
                <a href="base64.html" class="hover:underline">Base64</a>
                <a href="timestamp.html" class="font-bold underline">时间戳</a>
                <a href="text.html" class="hover:underline">文本处理</a>
                <a href="password.html" class="hover:underline">密码生成</a>
                <a href="qrcode.html" class="hover:underline">二维码</a>
                <a href="hash-url.html" class="hover:underline">哈希/URL</a>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <section class="bg-white p-6 rounded-xl shadow-sm space-y-6">
            <h1 class="text-2xl font-bold text-gray-800">Unix 时间戳转换工具</h1>
            <div class="p-4 bg-blue-50 rounded-lg flex justify-between items-center">
                <span class="text-sm">当前时间戳（秒）：<strong id="nowTs" class="text-blue-600 text-lg font-mono">0</strong></span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-4 border rounded-lg space-y-3">
                    <label class="block text-sm font-semibold">时间戳 → 北京时间</label>
                    <input type="number" id="tsInput" class="w-full p-2 border rounded font-mono text-sm" placeholder="例：1700000000">
                    <button onclick="tsToDate()" class="w-full bg-blue-600 text-white py-2 rounded text-sm hover:bg-blue-700">转换</button>
                    <p id="tsResult" class="text-sm font-mono text-blue-700 font-bold min-h-[20px]"></p>
                </div>
                <div class="p-4 border rounded-lg space-y-3">
                    <label class="block text-sm font-semibold">北京时间 → 时间戳</label>
                    <input type="text" id="dateInput" class="w-full p-2 border rounded font-mono text-sm" placeholder="例：2026-08-10 18:00:00">
                    <button onclick="dateToTs()" class="w-full bg-blue-600 text-white py-2 rounded text-sm hover:bg-blue-700">转换</button>
                    <p id="dateResult" class="text-sm font-mono text-blue-700 font-bold min-h-[20px]"></p>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500">
        <a href="privacy.html" class="hover:underline">隐私政策</a> | <a href="about.html" class="hover:underline">关于本站</a>
    </footer>

    <script>
        setInterval(() => document.getElementById('nowTs').innerText = Math.floor(Date.now() / 1000), 1000);
        function tsToDate() {
            const v = document.getElementById('tsInput').value.trim();
            if(v) document.getElementById('tsResult').innerText = new Date(parseInt(v) * (v.length===10?1000:1)).toLocaleString();
        }
        function dateToTs() {
            const v = document.getElementById('dateInput').value.trim();
            if(v) document.getElementById('dateResult').innerText = Math.floor(new Date(v).getTime() / 1000) + " (秒)";
        }
    </script>
</body>
</html>
