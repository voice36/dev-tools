<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Utilities - Word Count & Deduplication</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">DevTools Express</a>
            <select onchange="location = this.value;" class="bg-blue-700 text-white text-xs py-1 px-2 rounded border border-blue-400">
                <option value="/text.html" selected>🌐 English</option>
                <option value="/zh/text.html">中文 (Chinese)</option>
                <option value="/ja/text.html">日本語 (Japanese)</option>
            </select>
        </div>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full space-y-4">
        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-4">
            <h1 class="text-xl font-bold border-b pb-2">Text Processing Tools</h1>
            <textarea id="txtInput" oninput="countText()" class="w-full h-36 p-3 border rounded text-sm font-mono" placeholder="Paste your text here..."></textarea>
            <div class="text-xs font-semibold text-gray-600 space-x-4">
                <span>Characters: <b id="charCnt" class="text-blue-600">0</b></span>
                <span>Lines: <b id="lineCnt" class="text-blue-600">0</b></span>
            </div>
            <div class="flex gap-2">
                <button onclick="dedupe()" class="bg-blue-600 text-white px-4 py-1.5 rounded text-sm">Remove Duplicate Lines</button>
            </div>
        </section>
    </main>
    <script>
        function countText() {
            const txt = document.getElementById('txtInput').value;
            document.getElementById('charCnt').innerText = txt.length;
            document.getElementById('lineCnt').innerText = txt ? txt.split('\n').length : 0;
        }
        function dedupe() {
            const lines = document.getElementById('txtInput').value.split('\n');
            document.getElementById('txtInput').value = [...new Set(lines)].join('\n');
            countText();
        }
    </script>
</body>
</html>
