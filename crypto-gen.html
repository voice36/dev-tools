<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Mnemonic & Private Key Generator - DevTools Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">DevTools Express</a>
            <select onchange="location = this.value;" class="bg-blue-700 text-white text-xs py-1 px-2 rounded border border-blue-400">
                <option value="/crypto-gen.html" selected>🌐 English</option>
                <option value="/zh/crypto-gen.html">中文 (Chinese)</option>
                <option value="/ja/crypto-gen.html">日本語 (Japanese)</option>
            </select>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded text-xs text-amber-800">
            🔒 <b>100% Local Processing:</b> All mnemonics and private keys are computed offline via pure JavaScript in your browser.
        </div>

        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-5">
            <h1 class="text-xl font-bold border-b pb-2">Crypto Key & Mnemonic Generator</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Select Network Chain:</label>
                    <select id="coinType" onchange="onChainOrInputChange()" class="w-full p-2 border rounded text-sm bg-gray-50 font-medium focus:outline-none">
                        <option value="TRX">TRON (TRX / TRC-20)</option>
                        <option value="ETH">Ethereum (ETH / EVM Compatible)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Mnemonic Length:</label>
                    <select id="wordsCount" class="w-full p-2 border rounded text-sm bg-gray-50 font-medium focus:outline-none">
                        <option value="12">12 Words (Standard)</option>
                        <option value="24">24 Words (High Security)</option>
                    </select>
                </div>
            </div>

            <button onclick="generateRandomKeys()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-bold hover:bg-blue-700 transition">
                ⚡ Generate Brand New Keypair
            </button>

            <div class="space-y-4 pt-2">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-gray-600">BIP39 Mnemonic Phrase (Editable):</label>
                        <button type="button" onclick="silentCopy('mnemonicInput')" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-3 py-1 rounded transition">
                            📋 Copy Mnemonic
                        </button>
                    </div>
                    <textarea id="mnemonicInput" oninput="onMnemonicInput()" rows="2" class="w-full p-2.5 border rounded-lg font-mono text-sm text-blue-800 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Enter 12 or 24 mnemonic words..."></textarea>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-gray-600">Private Key (Editable):</label>
                        <button type="button" onclick="silentCopy('privKeyInput')" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-3 py-1 rounded transition">
                            📋 Copy Private Key
                        </button>
                    </div>
                    <input type="text" id="privKeyInput" oninput="onPrivKeyInput()" class="w-full p-2.5 border rounded-lg font-mono text-xs text-red-700 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Private key...">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-gray-600">Matching Receiving Address:</label>
                        <button type="button" onclick="silentCopy('addressOutput')" class="text-xs bg-green-50 hover:bg-green-100 text-green-700 font-semibold px-3 py-1 rounded transition">
                            📋 Copy Address
                        </button>
                    </div>
                    <input type="text" id="addressOutput" readonly class="w-full p-2.5 bg-gray-100 border rounded-lg font-mono text-xs text-green-700 font-bold focus:outline-none" placeholder="Real-time calculated address...">
                </div>
            </div>
        </section>

        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-3">
            <h2 class="text-sm font-bold text-gray-700">Official Exchanges & Mobile Wallets:</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                <a href="https://www.binance.com" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-yellow-50 font-semibold text-gray-800 border-yellow-200">Binance Official →</a>
                <a href="https://www.coinbase.com" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-blue-50 font-semibold text-gray-800 border-blue-200">Coinbase Official →</a>
                <a href="https://www.tokenpocket.pro" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-blue-50 font-semibold text-gray-800 border-blue-300">TokenPocket →</a>
                <a href="https://token.im" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-cyan-50 font-semibold text-gray-800 border-cyan-300">imToken →</a>
            </div>
        </section>
    </main>

    <script>
        async function sha256(bytes) {
            const hashBuffer = await crypto.subtle.digest('SHA-256', bytes);
            return new Uint8Array(hashBuffer);
        }

        const B58_ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
        function base58Encode(buffer) {
            let carry, digits = [0];
            for (let i = 0; i < buffer.length; i++) {
                carry = buffer[i];
                for (let j = 0; j < digits.length; j++) {
                    carry += digits[j] << 8;
                    digits[j] = carry % 58;
                    carry = (carry / 58) | 0;
                }
                while (carry > 0) {
                    digits.push(carry % 58);
                    carry = (carry / 58) | 0;
                }
            }
            let res = '';
            for (let i = 0; i < buffer.length && buffer[i] === 0; i++) res += B58_ALPHABET[0];
            for (let i = digits.length - 1; i >= 0; i--) res += B58_ALPHABET[digits[i]];
            return res;
        }

        async function tronBase58Check(ethAddressHex) {
            const cleanEthAddr = ethAddressHex.replace('0x', '');
            const payload = ethers.utils.arrayify('0x' + cleanEthAddr);
            
            const data = new Uint8Array(1 + payload.length);
            data[0] = 0x41;
            data.set(payload, 1);
            
            const h1 = await sha256(data);
            const h2 = await sha256(h1);
            const checksum = h2.slice(0, 4);

            const finalBuffer = new Uint8Array(data.length + 4);
            finalBuffer.set(data, 0);
            finalBuffer.set(checksum, data.length);

            return base58Encode(finalBuffer);
        }

        function formatPrivateKeyForCoin(rawKey, coin) {
            let clean = rawKey.trim();
            if (clean.startsWith('0x') || clean.startsWith('0X')) {
                clean = clean.substring(2);
            }
            clean = clean.toLowerCase();
            return coin === 'ETH' ? ('0x' + clean) : clean;
        }

        const DERIVATION_PATHS = {
            ETH: "m/44'/60'/0'/0/0",
            TRX: "m/44'/195'/0'/0/0"
        };

        function generateRandomKeys() {
            const count = parseInt(document.getElementById('wordsCount').value);
            const randomWallet = ethers.Wallet.createRandom();
            let mnemonic = randomWallet.mnemonic.phrase;
            
            if (count === 24) {
                mnemonic += " " + ethers.Wallet.createRandom().mnemonic.phrase;
            }
            
            document.getElementById('mnemonicInput').value = mnemonic;
            onMnemonicInput();
        }

        async function onMnemonicInput() {
            const mnemonic = document.getElementById('mnemonicInput').value.trim();
            if (!mnemonic) return;
            
            const coin = document.getElementById('coinType').value;
            const path = DERIVATION_PATHS[coin] || DERIVATION_PATHS.TRX;

            try {
                const hdNode = ethers.utils.HDNode.fromMnemonic(mnemonic.split(/\s+/).slice(0, 12).join(" "));
                const derivedNode = hdNode.derivePath(path);
                
                const formattedPrivKey = formatPrivateKeyForCoin(derivedNode.privateKey, coin);
                document.getElementById('privKeyInput').value = formattedPrivKey;
                await updateAddressForChain(formattedPrivKey);
            } catch (e) {
                document.getElementById('addressOutput').value = "Invalid mnemonic phrase";
            }
        }

        async function onPrivKeyInput() {
            const rawPrivKey = document.getElementById('privKeyInput').value.trim();
            if (!rawPrivKey) return;
            const coin = document.getElementById('coinType').value;
            try {
                const formattedPrivKey = formatPrivateKeyForCoin(rawPrivKey, coin);
                let checkKey = formattedPrivKey.startsWith('0x') ? formattedPrivKey : ('0x' + formattedPrivKey);
                new ethers.Wallet(checkKey);
                await updateAddressForChain(formattedPrivKey);
            } catch (e) {
                document.getElementById('addressOutput').value = "Invalid private key format";
            }
        }

        async function onChainOrInputChange() {
            const mnemonic = document.getElementById('mnemonicInput').value.trim();
            if (mnemonic && !document.getElementById('addressOutput').value.includes("Invalid")) {
                await onMnemonicInput();
            } else {
                await onPrivKeyInput();
            }
        }

        async function updateAddressForChain(formattedPrivateKey) {
            const coin = document.getElementById('coinType').value;
            let hexPrivateKey = formattedPrivateKey.startsWith('0x') ? formattedPrivateKey : ('0x' + formattedPrivateKey);
            const wallet = new ethers.Wallet(hexPrivateKey);

            if (coin === 'ETH') {
                document.getElementById('addressOutput').value = wallet.address;
            } 
            else if (coin === 'TRX') {
                const tronAddress = await tronBase58Check(wallet.address);
                document.getElementById('addressOutput').value = tronAddress;
            }
        }

        function silentCopy(elementId) {
            const element = document.getElementById(elementId);
            const textToCopy = element.value;

            if (!textToCopy) {
                alert("Nothing to copy!");
                return;
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert("Copied to clipboard!");
                }).catch(() => {
                    fallbackCopy(textToCopy);
                });
            } else {
                fallbackCopy(textToCopy);
            }
        }

        function fallbackCopy(text) {
            const tempInput = document.createElement("input");
            tempInput.value = text;
            tempInput.style.position = "absolute";
            tempInput.style.left = "-9999px";
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("Copied to clipboard!");
        }

        window.onload = generateRandomKeys;
    </script>
</body>
</html>
