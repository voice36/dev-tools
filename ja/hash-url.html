<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL エンコード/デコード - 無料Webツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">DevTools Express</a>
            <select onchange="location = this.value;" class="bg-blue-700 text-white text-xs py-1 px-2 rounded border border-blue-400">
                <option value="/hash-url.html">🌐 English</option>
                <option value="/zh/hash-url.html">中文 (Chinese)</option>
                <option value="/ja/hash-url.html" selected>日本語 (Japanese)</option>
            </select>
        </div>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full space-y-4">
        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-4">
            <h1 class="text-xl font-bold border-b pb-2">URL エンコード / デコード</h1>
            <textarea id="urlTxt" class="w-full h-24 p-3 border rounded text-sm font-mono" placeholder="テキストまたは URL を入力..."></textarea>
            <div class="flex gap-2">
                <button onclick="document.getElementById('urlRes').value = encodeURIComponent(document.getElementById('urlTxt').value)" class="bg-blue-600 text-white px-4 py-1.5 rounded text-sm">エンコード</button>
                <button onclick="document.getElementById('urlRes').value = decodeURIComponent(document.getElementById('urlTxt').value)" class="bg-green-600 text-white px-4 py-1.5 rounded text-sm">デコード</button>
            </div>
            <textarea id="urlRes" readonly class="w-full h-24 p-3 border rounded text-sm font-mono bg-gray-50"></textarea>
        </section>
    </main>
</body>
</html>
