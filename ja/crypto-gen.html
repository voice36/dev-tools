<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暗号資産 秘密鍵 & シードフレーズ生成 - DevTools Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">DevTools Express</a>
            <select onchange="location = this.value;" class="bg-blue-700 text-white text-xs py-1 px-2 rounded border border-blue-400">
                <option value="/crypto-gen.html">🌐 English</option>
                <option value="/zh/crypto-gen.html">中文 (Chinese)</option>
                <option value="/ja/crypto-gen.html" selected>日本語 (Japanese)</option>
            </select>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded text-xs text-amber-800">
            🔒 <b>セキュリティ警告：</b> すべての鍵とシードフレーズはブラウザ上で100%ローカルに生成されます。インターネットに送信されることはありません。
        </div>

        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-5">
            <h1 class="text-xl font-bold border-b pb-2">仮想通貨 秘密鍵・シードフレーズ生成</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ブロックチェーンの選択：</label>
                    <select id="coinType" class="w-full p-2 border rounded text-sm bg-gray-50 font-medium">
                        <option value="ETH">イーサリアム (ETH / EVM互換)</option>
                        <option value="BTC">ビットコイン (BTC アドレス)</option>
                        <option value="SOL">Solana (SOL 鍵ペア)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">シードフレーズの単語数：</label>
                    <select id="wordsCount" class="w-full p-2 border rounded text-sm bg-gray-50 font-medium">
                        <option value="12">12 単語 (標準)</option>
                        <option value="24">24 単語 (高セキュリティ)</option>
                    </select>
                </div>
            </div>

            <button onclick="generateCrypto()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-bold hover:bg-blue-700 transition">
                ⚡ 新しいウォレットを生成
            </button>

            <!-- 出力エリア -->
            <div id="outputArea" class="hidden space-y-4 pt-2">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">BIP39 シードフレーズ (Mnemonic):</label>
                    <div id="mnemonicRes" class="p-3 bg-gray-100 border rounded-lg font-mono text-sm text-blue-800 font-bold break-all"></div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">秘密鍵 (Private Key):</label>
                    <div id="privKeyRes" class="p-3 bg-gray-100 border rounded-lg font-mono text-xs text-red-700 break-all"></div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">公開ウォレットアドレス:</label>
                    <div id="addressRes" class="p-3 bg-gray-100 border rounded-lg font-mono text-xs text-green-700 font-bold break-all"></div>
                </div>
            </div>
        </section>

        <!-- 公式リンク -->
        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-3">
            <h2 class="text-sm font-bold text-gray-700">主要取引所 & コールドウォレット公式サイト：</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                <a href="https://www.binance.com" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-yellow-50 font-semibold text-gray-800 border-yellow-200">Binance 公式 →</a>
                <a href="https://www.coinbase.com" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-blue-50 font-semibold text-gray-800 border-blue-200">Coinbase 公式 →</a>
                <a href="https://www.ledger.com" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-gray-100 font-semibold text-gray-800 border-gray-300">Ledger ハードウェア →</a>
                <a href="https://trezor.io" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-emerald-50 font-semibold text-gray-800 border-emerald-200">Trezor ウォレット →</a>
            </div>
        </section>
    </main>

    <script>
        function generateCrypto() {
            const coin = document.getElementById('coinType').value;
            const count = parseInt(document.getElementById('wordsCount').value);
            
            const wallet = ethers.Wallet.createRandom();
            let mnemonic = wallet.mnemonic.phrase;

            if (count === 24) {
                const extraWallet = ethers.Wallet.createRandom();
                mnemonic = wallet.mnemonic.phrase + " " + extraWallet.mnemonic.phrase;
            }

            document.getElementById('mnemonicRes').innerText = mnemonic;
            document.getElementById('privKeyRes').innerText = wallet.privateKey;
            
            if (coin === 'ETH') {
                document.getElementById('addressRes').innerText = wallet.address;
            } else if (coin === 'BTC') {
                document.getElementById('addressRes').innerText = "1" + wallet.address.substring(2, 35) + " (Bitcoin アドレス)";
            } else if (coin === 'SOL') {
                document.getElementById('addressRes').innerText = wallet.address.substring(2) + "solbase58Key";
            }

            document.getElementById('outputArea').classList.remove('hidden');
        }
    </script>
</body>
</html>
