<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码与字符串生成器 - 极速在线工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">极速在线工具箱</a>
            <div class="text-xs sm:text-sm space-x-2 overflow-x-auto">
                <a href="json.html" class="hover:underline">JSON</a>
                <a href="base64.html" class="hover:underline">Base64</a>
                <a href="timestamp.html" class="hover:underline">时间戳</a>
                <a href="text.html" class="hover:underline">文本处理</a>
                <a href="password.html" class="font-bold underline">密码生成</a>
                <a href="qrcode.html" class="hover:underline">二维码</a>
                <a href="hash-url.html" class="hover:underline">哈希/URL</a>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <section class="bg-white p-6 rounded-xl shadow-sm space-y-4">
            <h1 class="text-2xl font-bold text-gray-800">高强度随机密码生成器</h1>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border p-4 rounded-lg">
                <div>
                    <label class="text-sm font-semibold">密码长度: <span id="lenVal" class="text-blue-600">16</span></label>
                    <input type="range" id="length" min="6" max="64" value="16" oninput="document.getElementById('lenVal').innerText=this.value" class="w-full">
                </div>
                <div class="flex flex-wrap gap-3 items-center text-sm">
                    <label><input type="checkbox" id="uppercase" checked> 大写字母 (A-Z)</label>
                    <label><input type="checkbox" id="lowercase" checked> 小写字母 (a-z)</label>
                    <label><input type="checkbox" id="numbers" checked> 数字 (0-9)</label>
                    <label><input type="checkbox" id="symbols" checked> 特殊字符 (!@#$)</label>
                </div>
            </div>
            <button onclick="generatePass()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">生成强密码</button>
            <textarea id="passResult" class="w-full h-32 p-3 border rounded-lg font-mono text-sm" placeholder="生成的密码将显示在此处..."></textarea>
        </section>
    </main>

    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500">
        <a href="privacy.html" class="hover:underline">隐私政策</a> | <a href="about.html" class="hover:underline">关于本站</a>
    </footer>

    <script>
        function generatePass() {
            const len = parseInt(document.getElementById('length').value);
            let chars = "";
            if(document.getElementById('uppercase').checked) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if(document.getElementById('lowercase').checked) chars += "abcdefghijklmnopqrstuvwxyz";
            if(document.getElementById('numbers').checked) chars += "0123456789";
            if(document.getElementById('symbols').checked) chars += "!@#$%^&*()_+-=[]{}|;:,.<>?";
            
            if(!chars) return alert("请至少勾选一种字符类型！");
            let pass = "";
            for(let i=0; i<len; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('passResult').value = pass;
        }
    </script>
</body>
</html>
