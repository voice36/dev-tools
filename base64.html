<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 文本编码与解码器 - 极速在线工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">极速在线工具箱</a>
            <div class="text-xs sm:text-sm space-x-2 overflow-x-auto">
                <a href="json.html" class="hover:underline">JSON</a>
                <a href="base64.html" class="font-bold underline">Base64</a>
                <a href="timestamp.html" class="hover:underline">时间戳</a>
                <a href="text.html" class="hover:underline">文本处理</a>
                <a href="password.html" class="hover:underline">密码生成</a>
                <a href="qrcode.html" class="hover:underline">二维码</a>
                <a href="hash-url.html" class="hover:underline">哈希/URL</a>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <section class="bg-white p-6 rounded-xl shadow-sm space-y-4">
            <h1 class="text-2xl font-bold text-gray-800">Base64 在线编码与解码器</h1>
            <textarea id="baseInput" class="w-full h-56 p-3 border rounded-lg font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="输入需要编码或解码的文本..."></textarea>
            <div class="flex flex-wrap gap-2">
                <button onclick="encodeBase64()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 font-medium">Base64 编码</button>
                <button onclick="decodeBase64()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700 font-medium">Base64 解码</button>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500">
        <a href="privacy.html" class="hover:underline">隐私政策</a> | <a href="about.html" class="hover:underline">关于本站</a>
    </footer>

    <script>
        function encodeBase64() {
            const input = document.getElementById('baseInput');
            try { input.value = btoa(unescape(encodeURIComponent(input.value))); } catch(e){}
        }
        function decodeBase64() {
            const input = document.getElementById('baseInput');
            try { input.value = decodeURIComponent(escape(atob(input.value))); } catch(e){}
        }
    </script>
</body>
</html>
