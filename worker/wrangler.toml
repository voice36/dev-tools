name = "devtools-api"
main = "index.js"
compatibility_date = "2026-09-01"

# Serve /api/* from the Worker, keep everything else on the origin (nginx).
[[routes]]
pattern = "tools.vexum.top/api/*"
zone_name = "vexum.top"

# Secrets are NOT stored here. Set them with:
#   wrangler secret put ETHERSCAN_API_KEY
#   wrangler secret put TRON_PRO_API_KEY        # optional
