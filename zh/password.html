<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码生成器 - 极速在线工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">极速在线工具箱</a>
            <select onchange="location = this.value;" class="bg-blue-700 text-white text-xs py-1 px-2 rounded border border-blue-400">
                <option value="/password.html">🌐 English</option>
                <option value="/zh/password.html" selected>中文 (Chinese)</option>
                <option value="/ja/password.html">日本語 (Japanese)</option>
            </select>
        </div>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-4">
            <h1 class="text-xl font-bold border-b pb-2">高强度随机密码生成器</h1>
            <div class="flex items-center gap-3">
                <label class="text-sm font-medium">密码长度：</label>
                <input type="number" id="len" value="16" class="p-1 border rounded w-16 text-center text-sm font-bold">
                <button onclick="genPass()" class="bg-blue-600 text-white px-4 py-1.5 rounded text-sm hover:bg-blue-700">生成密码</button>
            </div>
            <div class="p-4 bg-gray-50 border rounded text-lg font-mono font-bold text-blue-700 break-all" id="passResult">点击生成按钮...</div>
        </section>
    </main>
    <script>
        function genPass() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+";
            let len = parseInt(document.getElementById('len').value) || 16;
            let res = "";
            for (let i = 0; i < len; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById('passResult').innerText = res;
        }
    </script>
</body>
</html>
