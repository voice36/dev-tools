<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转 Base64 编码 - 极速在线工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">极速在线工具箱</a>
            <select onchange="location = this.value;" class="bg-blue-700 text-white text-xs py-1 px-2 rounded border border-blue-400">
                <option value="/img-base64.html">🌐 English</option>
                <option value="/zh/img-base64.html" selected>中文 (Chinese)</option>
                <option value="/ja/img-base64.html">日本語 (Japanese)</option>
            </select>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-4">
            <h1 class="text-xl font-bold border-b pb-2">图片文件转 Base64 Data URL 在线转换</h1>
            
            <input type="file" id="imgFile" accept="image/*" onchange="convertImg()" class="block w-full text-sm text-gray-500">

            <div id="resultBox" class="hidden space-y-3 pt-2">
                <label class="block text-xs font-bold text-gray-600">Base64 字符串结果：</label>
                <textarea id="base64Res" rows="6" readonly class="w-full p-2.5 bg-gray-100 border rounded-lg font-mono text-xs break-all focus:outline-none"></textarea>
                <button onclick="navigator.clipboard.writeText(document.getElementById('base64Res').value); alert('已复制！');" class="bg-blue-600 text-white text-xs px-4 py-2 rounded font-medium hover:bg-blue-700">📋 复制 Base64</button>
            </div>
        </section>
    </main>

    <script>
        function convertImg() {
            const file = document.getElementById('imgFile').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById('base64Res').value = e.target.result;
                document.getElementById('resultBox').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
