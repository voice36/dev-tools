<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量加密货币钱包生成器 - 极速在线工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">极速在线工具箱</a>
            <select onchange="location = this.value;" class="bg-blue-700 text-white text-xs py-1 px-2 rounded border border-blue-400">
                <option value="/batch-wallet.html">🌐 English</option>
                <option value="/zh/batch-wallet.html" selected>中文 (Chinese)</option>
                <option value="/ja/batch-wallet.html">日本語 (Japanese)</option>
            </select>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded text-xs text-amber-800">
            🔒 <b>安全提示：</b> 所有批量钱包均在您的浏览器本地纯 JavaScript 随机派生计算，数据绝不上报。最高支持单次批量生成 10,000 个钱包。
        </div>

        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-5">
            <h1 class="text-xl font-bold border-b pb-2">离线批量钱包生成工具</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">主链类型：</label>
                    <select id="coinType" class="w-full p-2 border rounded text-sm bg-gray-50 font-medium focus:outline-none">
                        <option value="TRX">TRON (波场 TRX / TRC-20)</option>
                        <option value="ETH">ETH / EVM (以太坊/BSC/Polygon)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">生成数量 (1-10000 个)：</label>
                    <input type="number" id="genCount" value="10" min="1" max="10000" class="w-full p-2 border rounded text-sm font-medium focus:outline-none">
                </div>
                <div class="flex items-end">
                    <button id="genBtn" onclick="startBatchGeneration()" class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm font-bold hover:bg-blue-700 transition">
                        ⚡ 批量生成钱包
                    </button>
                </div>
            </div>

            <!-- 生成进度与列表 -->
            <div id="outputContainer" class="hidden space-y-3 pt-2">
                <div class="flex justify-between items-center">
                    <span id="progressText" class="text-xs font-bold text-gray-600">正在计算中...</span>
                    <button onclick="exportCSV()" class="bg-green-600 text-white text-xs px-3 py-1.5 rounded font-bold hover:bg-green-700">
                        📥 导出 CSV Excel 文件
                    </button>
                </div>

                <div class="overflow-x-auto border rounded-lg max-h-[500px]">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead class="sticky top-0 bg-gray-100 border-b font-bold text-gray-700">
                            <tr>
                                <th class="p-2.5 w-12">#</th>
                                <th class="p-2.5">收款地址 (Address)</th>
                                <th class="p-2.5">明文私钥 (Private Key)</th>
                                <th class="p-2.5">助记词 (Mnemonic)</th>
                            </tr>
                        </thead>
                        <tbody id="walletTableBody" class="font-mono divide-y"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script>
        let generatedWallets = [];

        async function sha256(bytes) {
            const hashBuffer = await crypto.subtle.digest('SHA-256', bytes);
            return new Uint8Array(hashBuffer);
        }

        const B58_ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
        function base58Encode(buffer) {
            let carry, digits = [0];
            for (let i = 0; i < buffer.length; i++) {
                carry = buffer[i];
                for (let j = 0; j < digits.length; j++) {
                    carry += digits[j] << 8;
                    digits[j] = carry % 58;
                    carry = (carry / 58) | 0;
                }
                while (carry > 0) {
                    digits.push(carry % 58);
                    carry = (carry / 58) | 0;
                }
            }
            let res = '';
            for (let i = 0; i < buffer.length && buffer[i] === 0; i++) res += B58_ALPHABET[0];
            for (let i = digits.length - 1; i >= 0; i--) res += B58_ALPHABET[digits[i]];
            return res;
        }

        async function tronBase58Check(ethAddressHex) {
            const cleanEthAddr = ethAddressHex.replace('0x', '');
            const payload = ethers.utils.arrayify('0x' + cleanEthAddr);
            const data = new Uint8Array(1 + payload.length);
            data[0] = 0x41;
            data.set(payload, 1);
            const h1 = await sha256(data);
            const h2 = await sha256(h1);
            const checksum = h2.slice(0, 4);
            const finalBuffer = new Uint8Array(data.length + 4);
            finalBuffer.set(data, 0);
            finalBuffer.set(checksum, data.length);
            return base58Encode(finalBuffer);
        }

        async function startBatchGeneration() {
            const coin = document.getElementById('coinType').value;
            let total = parseInt(document.getElementById('genCount').value);
            if (total < 1) total = 1;
            if (total > 10000) total = 10000;

            const genBtn = document.getElementById('genBtn');
            const progressText = document.getElementById('progressText');
            const tableBody = document.getElementById('walletTableBody');
            
            tableBody.innerHTML = '';
            generatedWallets = [];
            genBtn.disabled = true;
            genBtn.classList.add('opacity-50');
            document.getElementById('outputContainer').classList.remove('hidden');

            const chunkSize = 20; // 20个一批异步计算，保证浏览器卡顿率最小
            let current = 0;

            async function processChunk() {
                const end = Math.min(current + chunkSize, total);
                for (let i = current; i < end; i++) {
                    const wallet = ethers.Wallet.createRandom();
                    let address = wallet.address;
                    let privKey = wallet.privateKey;

                    if (coin === 'TRX') {
                        // 使用波场标准的 m/44'/195'/0'/0/0 BIP44 衍生路径
                        const hdNode = ethers.utils.HDNode.fromMnemonic(wallet.mnemonic.phrase);
                        const tronNode = hdNode.derivePath("m/44'/195'/0'/0/0");
                        const tronWallet = new ethers.Wallet(tronNode.privateKey);
                        
                        address = await tronBase58Check(tronWallet.address);
                        privKey = tronNode.privateKey.substring(2).toLowerCase();
                    }

                    const walletObj = {
                        id: i + 1,
                        address: address,
                        privateKey: privKey,
                        mnemonic: wallet.mnemonic.phrase
                    };

                    generatedWallets.push(walletObj);

                    // 如果总数在 500 以内渲染表格 DOM，太大时只保留数据以提升生成性能
                    if (total <= 500) {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50";
                        tr.innerHTML = `
                            <td class="p-2.5 text-gray-500 font-sans">${walletObj.id}</td>
                            <td class="p-2.5 text-green-700 font-bold break-all">${walletObj.address}</td>
                            <td class="p-2.5 text-red-600 break-all">${walletObj.privateKey}</td>
                            <td class="p-2.5 text-blue-800 break-all">${walletObj.mnemonic}</td>
                        `;
                        tableBody.appendChild(tr);
                    }
                }

                current = end;
                progressText.innerText = `已成功生成: ${current} / ${total} 个钱包 ${total > 500 ? '(数据量较大，建议导出 CSV 查看)' : ''}`;

                if (current < total) {
                    setTimeout(processChunk, 0);
                } else {
                    genBtn.disabled = false;
                    genBtn.classList.remove('opacity-50');
                }
            }

            processChunk();
        }

        function exportCSV() {
            if (generatedWallets.length === 0) return alert("暂无生成的钱包数据！");
            let csvContent = "data:text/csv;charset=utf-8,ID,Address,PrivateKey,Mnemonic\n";
            generatedWallets.forEach(w => {
                csvContent += `${w.id},${w.address},${w.privateKey},"${w.mnemonic}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `batch_wallets_${generatedWallets.length}_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
