<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT 解析与解码器 - 极速在线工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">极速在线工具箱</a>
            <select onchange="location = this.value;" class="bg-blue-700 text-white text-xs py-1 px-2 rounded border border-blue-400">
                <option value="/jwt.html">🌐 English</option>
                <option value="/zh/jwt.html" selected>中文 (Chinese)</option>
                <option value="/ja/jwt.html">日本語 (Japanese)</option>
            </select>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-4">
            <h1 class="text-xl font-bold border-b pb-2">JWT (JSON Web Token) 本地在线解码</h1>
            
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">粘贴 JWT 字符串：</label>
                <textarea id="jwtInput" oninput="decodeJWT()" rows="3" class="w-full p-2.5 border rounded-lg font-mono text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Header (算法与类型):</label>
                    <pre id="headerOutput" class="p-3 bg-gray-100 border rounded-lg font-mono text-xs text-red-600 min-h-[120px] overflow-x-auto"></pre>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Payload (数据载荷):</label>
                    <pre id="payloadOutput" class="p-3 bg-gray-100 border rounded-lg font-mono text-xs text-blue-600 min-h-[120px] overflow-x-auto"></pre>
                </div>
            </div>
        </section>
    </main>

    <script>
        function decodeJWT() {
            const jwt = document.getElementById('jwtInput').value.trim();
            const parts = jwt.split('.');
            if (parts.length < 2) {
                document.getElementById('headerOutput').innerText = "无效的 JWT 格式";
                document.getElementById('payloadOutput').innerText = "无效的 JWT 格式";
                return;
            }
            try {
                const header = JSON.parse(atob(parts[0].replace(/-/g, '+').replace(/_/g, '/')));
                const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
                document.getElementById('headerOutput').innerText = JSON.stringify(header, null, 2);
                document.getElementById('payloadOutput').innerText = JSON.stringify(payload, null, 2);
            } catch(e) {
                document.getElementById('headerOutput').innerText = "解码失败";
                document.getElementById('payloadOutput').innerText = "解码失败";
            }
        }
    </script>
</body>
</html>
