<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正则表达式测试器 - 极速在线工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">极速在线工具箱</a>
            <select onchange="location = this.value;" class="bg-blue-700 text-white text-xs py-1 px-2 rounded border border-blue-400">
                <option value="/regex.html">🌐 English</option>
                <option value="/zh/regex.html" selected>中文 (Chinese)</option>
                <option value="/ja/regex.html">日本語 (Japanese)</option>
            </select>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-4">
            <h1 class="text-xl font-bold border-b pb-2">正则表达式在线测试工具</h1>
            
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">正则表达式 (Regular Expression):</label>
                <input type="text" id="regexPattern" value="[a-zA-Z0-9_-]+@[a-zA-Z0-9_-]+\.[a-zA-Z]+" oninput="testRegex()" class="w-full p-2.5 border rounded-lg font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">测试文本 (Test String):</label>
                <textarea id="regexText" oninput="testRegex()" rows="4" class="w-full p-2.5 border rounded-lg font-mono text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="输入测试文本...">测试邮箱: support@haha6.top 以及 hello_world@gmail.com</textarea>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">匹配结果 (Matches):</label>
                <div id="matchOutput" class="p-3 bg-gray-100 border rounded-lg font-mono text-xs min-h-[60px] text-green-700 font-bold"></div>
            </div>
        </section>
    </main>

    <script>
        function testRegex() {
            const pattern = document.getElementById('regexPattern').value;
            const text = document.getElementById('regexText').value;
            const output = document.getElementById('matchOutput');
            if(!pattern || !text) return output.innerText = "无匹配结果";
            try {
                const reg = new RegExp(pattern, 'g');
                const matches = text.match(reg);
                output.innerText = matches ? matches.join('\n') : "未找到匹配项";
            } catch(e) {
                output.innerText = "正则表达式语法错误";
            }
        }
        window.onload = testRegex;
    </script>
</body>
</html>
