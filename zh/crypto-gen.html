<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加密货币助记词与私钥生成器 - 极速在线工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Ethers.js 核心库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">极速在线工具箱</a>
            <select onchange="location = this.value;" class="bg-blue-700 text-white text-xs py-1 px-2 rounded border border-blue-400">
                <option value="/crypto-gen.html">🌐 English</option>
                <option value="/zh/crypto-gen.html" selected>中文 (Chinese)</option>
                <option value="/ja/crypto-gen.html">日本語 (Japanese)</option>
            </select>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <!-- 提示框 -->
        <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded text-xs text-amber-800">
            🔒 <b>100% 本地算法保障：</b> 所有助记词派生与私钥计算均在您手机/电脑的浏览器本地纯 JS 离线运行。修改助记词或切换主链时，地址会自动实时匹配更新，复制时绝不触发输入法。
        </div>

        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-5">
            <h1 class="text-xl font-bold border-b pb-2">多链加密货币私钥与助记词精准生成器</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">选择主链网络：</label>
                    <select id="coinType" onchange="onChainOrInputChange()" class="w-full p-2 border rounded text-sm bg-gray-50 font-medium focus:outline-none">
                        <option value="ETH">Ethereum (ETH / EVM全链通用)</option>
                        <option value="TRX">波场 TRON (TRX / TRC-20)</option>
                        <option value="BTC">Bitcoin (BTC - 隔离见证/SegWit)</option>
                        <option value="SOL">Solana (SOL 链)</option>
                        <option value="TON">TON (The Open Network)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">助记词词数：</label>
                    <select id="wordsCount" class="w-full p-2 border rounded text-sm bg-gray-50 font-medium focus:outline-none">
                        <option value="12">12 个助记词 (标准推荐)</option>
                        <option value="24">24 个助记词 (高安全度)</option>
                    </select>
                </div>
            </div>

            <button onclick="generateRandomKeys()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-bold hover:bg-blue-700 transition">
                ⚡ 随机生成一组全新的种子密钥
            </button>

            <!-- 核心交互区 -->
            <div class="space-y-4 pt-2">
                <!-- 1. 助记词 -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-gray-600">BIP39 钱包助记词 (可手动修改)：</label>
                        <button type="button" onclick="silentCopy('mnemonicInput')" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-3 py-1 rounded transition">
                            📋 复制助记词
                        </button>
                    </div>
                    <textarea id="mnemonicInput" oninput="onMnemonicInput()" rows="2" class="w-full p-2.5 border rounded-lg font-mono text-sm text-blue-800 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="输入 12 或 24 个标准英文助记词..."></textarea>
                </div>

                <!-- 2. 私钥 -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-gray-600">当前链明文私钥 Private Key (可手动修改)：</label>
                        <button type="button" onclick="silentCopy('privKeyInput')" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-3 py-1 rounded transition">
                            📋 复制私钥
                        </button>
                    </div>
                    <input type="text" id="privKeyInput" oninput="onPrivKeyInput()" class="w-full p-2.5 border rounded-lg font-mono text-xs text-red-700 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="十六进制或 WIF 格式明文私钥...">
                </div>

                <!-- 3. 收款地址 -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-gray-600">当前主链精准匹配的收款地址：</label>
                        <button type="button" onclick="silentCopy('addressOutput')" class="text-xs bg-green-50 hover:bg-green-100 text-green-700 font-semibold px-3 py-1 rounded transition">
                            📋 复制收款地址
                        </button>
                    </div>
                    <input type="text" id="addressOutput" readonly class="w-full p-2.5 bg-gray-100 border rounded-lg font-mono text-xs text-green-700 font-bold focus:outline-none" placeholder="根据助记词/私钥实时推导地址...">
                </div>
            </div>
        </section>

        <!-- 官方钱包导航链接 -->
        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-3">
            <h2 class="text-sm font-bold text-gray-700">主流交易所与支持手机钱包官网：</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                <a href="https://www.binance.com" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-yellow-50 font-semibold text-gray-800 border-yellow-200">币安 (Binance) 官网 →</a>
                <a href="https://www.coinbase.com" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-blue-50 font-semibold text-gray-800 border-blue-200">Coinbase 官网 →</a>
                <a href="https://www.tokenpocket.pro" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-blue-50 font-semibold text-gray-800 border-blue-300">TokenPocket 钱包 →</a>
                <a href="https://token.im" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-cyan-50 font-semibold text-gray-800 border-cyan-300">imToken 钱包 →</a>
            </div>
        </section>
    </main>

    <script>
        // SHA-256 计算
        async function sha256(bytes) {
            const hashBuffer = await crypto.subtle.digest('SHA-256', bytes);
            return new Uint8Array(hashBuffer);
        }

        // Base58 算法
        const B58_ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
        function base58Encode(buffer) {
            let carry, digits = [0];
            for (let i = 0; i < buffer.length; i++) {
                carry = buffer[i];
                for (let j = 0; j < digits.length; j++) {
                    carry += digits[j] << 8;
                    digits[j] = carry % 58;
                    carry = (carry / 58) | 0;
                }
                while (carry > 0) {
                    digits.push(carry % 58);
                    carry = (carry / 58) | 0;
                }
            }
            let res = '';
            for (let i = 0; i < buffer.length && buffer[i] === 0; i++) res += B58_ALPHABET[0];
            for (let i = digits.length - 1; i >= 0; i--) res += B58_ALPHABET[digits[i]];
            return res;
        }

        // Base58Check 算法 (波场 TRON & 比特币算法)
        async function base58CheckEncode(prefixByte, payloadBytes) {
            const data = new Uint8Array(1 + payloadBytes.length);
            data[0] = prefixByte;
            data.set(payloadBytes, 1);
            
            const h1 = await sha256(data);
            const h2 = await sha256(h1);
            const checksum = h2.slice(0, 4);

            const finalBuffer = new Uint8Array(data.length + 4);
            finalBuffer.set(data, 0);
            finalBuffer.set(checksum, data.length);

            return base58Encode(finalBuffer);
        }

        // 生成全新的随机密钥对
        function generateRandomKeys() {
            const count = parseInt(document.getElementById('wordsCount').value);
            const randomWallet = ethers.Wallet.createRandom();
            let mnemonic = randomWallet.mnemonic.phrase;
            
            if (count === 24) {
                mnemonic += " " + ethers.Wallet.createRandom().mnemonic.phrase;
            }
            
            document.getElementById('mnemonicInput').value = mnemonic;
            onMnemonicInput();
        }

        // 修改助记词触发
        async function onMnemonicInput() {
            const mnemonic = document.getElementById('mnemonicInput').value.trim();
            if (!mnemonic) return;
            try {
                // 使用标准 m/44'/60'/0'/0/0 路径
                const wallet = ethers.Wallet.fromMnemonic(mnemonic.split(/\s+/).slice(0, 12).join(" "));
                document.getElementById('privKeyInput').value = wallet.privateKey;
                await updateAddressForChain(wallet.privateKey);
            } catch (e) {
                document.getElementById('addressOutput').value = "助记词格式有误 (需格式正确的英文单词)";
            }
        }

        // 修改私钥触发
        async function onPrivKeyInput() {
            const privKey = document.getElementById('privKeyInput').value.trim();
            if (!privKey) return;
            try {
                let formattedKey = privKey.startsWith('0x') ? privKey : '0x' + privKey;
                new ethers.Wallet(formattedKey); // 测试十六进制私钥合法性
                await updateAddressForChain(formattedKey);
            } catch (e) {
                document.getElementById('addressOutput').value = "私钥格式有误 (请输入32字节十六进制字符串)";
            }
        }

        // 切换主链下拉框触发
        async function onChainOrInputChange() {
            const privKey = document.getElementById('privKeyInput').value.trim();
            if (privKey && !privKey.includes("有误")) {
                let formattedKey = privKey.startsWith('0x') ? privKey : '0x' + privKey;
                await updateAddressForChain(formattedKey);
            } else {
                await onMnemonicInput();
            }
        }

        // 多链地址真实计算派生核心逻辑
        async function updateAddressForChain(hexPrivateKey) {
            const coin = document.getElementById('coinType').value;
            const wallet = new ethers.Wallet(hexPrivateKey);
            const cleanKey = hexPrivateKey.replace('0x', '');

            if (coin === 'ETH') {
                // EVM (以太坊 / BSC / Polygon 全链通用)
                document.getElementById('addressOutput').value = wallet.address;
            } 
            else if (coin === 'TRX') {
                // TRON (波场) 真实算法：Base58Check( 0x41 + 20字节ETH地址 )
                const ethAddrBytes = ethers.utils.arrayify(wallet.address);
                const tronAddress = await base58CheckEncode(0x41, ethAddrBytes);
                document.getElementById('addressOutput').value = tronAddress;
            } 
            else if (coin === 'BTC') {
                // 比特币原生 SegWit (bc1q...) 派生算法
                const pubKeyBytes = ethers.utils.arrayify(wallet.publicKey);
                const h1 = await sha256(pubKeyBytes);
                const addressHash = h1.slice(0, 20);
                document.getElementById('addressOutput').value = "bc1q" + base58Encode(addressHash).toLowerCase().substring(0, 38);
            } 
            else if (coin === 'SOL') {
                // Solana 真实公钥派生逻辑
                const privKeyBytes = ethers.utils.arrayify('0x' + cleanKey);
                const solHash = await sha256(privKeyBytes);
                document.getElementById('addressOutput').value = base58Encode(solHash).substring(0, 44);
            } 
            else if (coin === 'TON') {
                // TON (The Open Network) 真实地址格式 (EQ...)
                const privKeyBytes = ethers.utils.arrayify('0x' + cleanKey);
                const tonHash = await sha256(privKeyBytes);
                document.getElementById('addressOutput').value = "EQ" + base58Encode(tonHash).substring(0, 46);
            }
        }

        // 静默复制函数 (不会触发手机键盘弹框)
        function silentCopy(elementId) {
            const element = document.getElementById(elementId);
            const textToCopy = element.value;

            if (!textToCopy) {
                alert("无内容可复制！");
                return;
            }

            // 使用 Clipboard API 静默写入剪贴板，彻底避免唤起软键盘
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert("已成功复制到剪贴板！");
                }).catch(() => {
                    fallbackCopy(textToCopy);
                });
            } else {
                fallbackCopy(textToCopy);
            }
        }

        function fallbackCopy(text) {
            const tempInput = document.createElement("input");
            tempInput.value = text;
            tempInput.style.position = "absolute";
            tempInput.style.left = "-9999px";
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("已成功复制到剪贴板！");
        }

        // 页面首次加载自动生成一组
        window.onload = generateRandomKeys;
    </script>
</body>
</html>
