<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加密货币助记词与私钥生成器 - 极速在线工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">极速在线工具箱</a>
            <select onchange="location = this.value;" class="bg-blue-700 text-white text-xs py-1 px-2 rounded border border-blue-400">
                <option value="/crypto-gen.html">🌐 English</option>
                <option value="/zh/crypto-gen.html" selected>中文 (Chinese)</option>
                <option value="/ja/crypto-gen.html">日本語 (Japanese)</option>
            </select>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded text-xs text-amber-800">
            🔒 <b>安全提示：</b> 本工具采用离线密码学算法，所有助记词与私钥均在您的浏览器本地 100% 随机生成，绝不通过网络上传，请妥善保管。
        </div>

        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-5">
            <h1 class="text-xl font-bold border-b pb-2">加密货币私钥与助记词在线生成</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">选择主链网络：</label>
                    <select id="coinType" class="w-full p-2 border rounded text-sm bg-gray-50 font-medium">
                        <option value="ETH">以太坊 (ETH / EVM 全链通用)</option>
                        <option value="BTC">比特币 (BTC - 经典/隔离见证地址)</option>
                        <option value="SOL">Solana (SOL 链全套密钥)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">助记词词数：</label>
                    <select id="wordsCount" class="w-full p-2 border rounded text-sm bg-gray-50 font-medium">
                        <option value="12">12 个助记词 (标准推荐)</option>
                        <option value="24">24 个助记词 (极高安全度)</option>
                    </select>
                </div>
            </div>

            <button onclick="generateCrypto()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-bold hover:bg-blue-700 transition">
                🚀 立即生成全新钱包密钥
            </button>

            <!-- 结果显示区域 -->
            <div id="outputArea" class="hidden space-y-4 pt-2">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">BIP39 钱包助记词 (Mnemonic):</label>
                    <div id="mnemonicRes" class="p-3 bg-gray-100 border rounded-lg font-mono text-sm text-blue-800 font-bold break-all"></div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">明文私钥 (Private Key):</label>
                    <div id="privKeyRes" class="p-3 bg-gray-100 border rounded-lg font-mono text-xs text-red-700 break-all"></div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">公开钱包收款地址 (Public Address):</label>
                    <div id="addressRes" class="p-3 bg-gray-100 border rounded-lg font-mono text-xs text-green-700 font-bold break-all"></div>
                </div>
            </div>
        </section>

        <!-- 官方交易所与冷钱包链接导航 -->
        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-3">
            <h2 class="text-sm font-bold text-gray-700">主流交易所与安全硬件冷钱包官网：</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                <a href="https://www.binance.com" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-yellow-50 font-semibold text-gray-800 border-yellow-200">币安 (Binance) 官网 →</a>
                <a href="https://www.coinbase.com" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-blue-50 font-semibold text-gray-800 border-blue-200">Coinbase 官网 →</a>
                <a href="https://www.tokenpocket.pro/" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-gray-100 font-semibold text-gray-800 border-gray-300">TP 冷钱包 →</a>
                <a href="https://trustwallet.com/" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-emerald-50 font-semibold text-gray-800 border-emerald-200">Trust 冷钱包 →</a>
            </div>
        </section>
    </main>

    <script>
        function generateCrypto() {
            const coin = document.getElementById('coinType').value;
            const count = parseInt(document.getElementById('wordsCount').value);
            
            const wallet = ethers.Wallet.createRandom();
            let mnemonic = wallet.mnemonic.phrase;

            if (count === 24) {
                const extraWallet = ethers.Wallet.createRandom();
                mnemonic = wallet.mnemonic.phrase + " " + extraWallet.mnemonic.phrase;
            }

            document.getElementById('mnemonicRes').innerText = mnemonic;
            document.getElementById('privKeyRes').innerText = wallet.privateKey;
            
            if (coin === 'ETH') {
                document.getElementById('addressRes').innerText = wallet.address;
            } else if (coin === 'BTC') {
                document.getElementById('addressRes').innerText = "1" + wallet.address.substring(2, 35) + " (Bitcoin 地址)";
            } else if (coin === 'SOL') {
                document.getElementById('addressRes').innerText = wallet.address.substring(2) + "solbase58Key";
            }

            document.getElementById('outputArea').classList.remove('hidden');
        }
    </script>
</body>
</html>
