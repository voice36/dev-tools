<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加密货币助记词与私钥生成器 - 极速在线工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">极速在线工具箱</a>
            <select onchange="location = this.value;" class="bg-blue-700 text-white text-xs py-1 px-2 rounded border border-blue-400">
                <option value="/crypto-gen.html">🌐 English</option>
                <option value="/zh/crypto-gen.html" selected>中文 (Chinese)</option>
                <option value="/ja/crypto-gen.html">日本語 (Japanese)</option>
            </select>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded text-xs text-amber-800">
            🔒 <b>安全提示：</b> 所有计算均在您的浏览器本地 100% 离线完成。您可以自由修改助记词、私钥或切换主链，地址将实时计算刷新，绝不上传任何数据。
        </div>

        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-5">
            <h1 class="text-xl font-bold border-b pb-2">多链私钥与助记词在线生成器</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">选择主链网络：</label>
                    <select id="coinType" onchange="deriveFromCurrentState()" class="w-full p-2 border rounded text-sm bg-gray-50 font-medium">
                        <option value="ETH">以太坊 (ETH / EVM 全链通用)</option>
                        <option value="BTC">比特币 (BTC 原生隔离见证/Legacy)</option>
                        <option value="SOL">Solana (SOL 链)</option>
                        <option value="TRX">波场 TRON (TRX / TRC-20)</option>
                        <option value="TON">TON (The Open Network)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">生成助记词长度：</label>
                    <select id="wordsCount" class="w-full p-2 border rounded text-sm bg-gray-50 font-medium">
                        <option value="12">12 个助记词 (标准格式)</option>
                        <option value="24">24 个助记词 (高安全度)</option>
                    </select>
                </div>
            </div>

            <button onclick="generateRandomWallet()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-bold hover:bg-blue-700 transition">
                ⚡ 随机生成一组全新的钱包密钥
            </button>

            <!-- 可交互与编辑区域 -->
            <div class="space-y-4 pt-2">
                <!-- 助记词 -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-gray-600">BIP39 钱包助记词 (可自主修改)：</label>
                        <button onclick="copyField('mnemonicInput')" class="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded font-medium text-gray-700">📋 复制</button>
                    </div>
                    <textarea id="mnemonicInput" oninput="onMnemonicChange()" rows="2" class="w-full p-2.5 border rounded-lg font-mono text-sm text-blue-800 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="输入 12 或 24 个英文助记词，用空格隔开..."></textarea>
                </div>

                <!-- 私钥 -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-gray-600">明文私钥 Private Key (可自主修改)：</label>
                        <button onclick="copyField('privKeyInput')" class="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded font-medium text-gray-700">📋 复制</button>
                    </div>
                    <input type="text" id="privKeyInput" oninput="onPrivKeyChange()" class="w-full p-2.5 border rounded-lg font-mono text-xs text-red-700 font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="输入十六进制明文私钥...">
                </div>

                <!-- 实时收款地址 -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-gray-600">实时匹配推导的公开收款地址：</label>
                        <button onclick="copyField('addressOutput')" class="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded font-medium text-gray-700">📋 复制</button>
                    </div>
                    <input type="text" id="addressOutput" readonly class="w-full p-2.5 bg-gray-100 border rounded-lg font-mono text-xs text-green-700 font-bold" placeholder="地址将根据私钥/助记词实时刷新显示...">
                </div>
            </div>
        </section>

        <!-- 交易所与钱包 -->
        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-3">
            <h2 class="text-sm font-bold text-gray-700">主流交易所与支持的手机钱包官网：</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                <a href="https://www.binance.com" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-yellow-50 font-semibold text-gray-800 border-yellow-200">币安 (Binance) 官网 →</a>
                <a href="https://www.coinbase.com" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-blue-50 font-semibold text-gray-800 border-blue-200">Coinbase 官网 →</a>
                <a href="https://www.tokenpocket.pro" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-blue-50 font-semibold text-gray-800 border-blue-300">TokenPocket 钱包 →</a>
                <a href="https://token.im" target="_blank" rel="noopener noreferrer" class="p-3 border rounded-lg text-center hover:bg-cyan-50 font-semibold text-gray-800 border-cyan-300">imToken 钱包 →</a>
            </div>
        </section>
    </main>

    <script>
        const ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
        function toBase58(buffer) {
            let carry, digits = [0];
            for (let i = 0; i < buffer.length; i++) {
                carry = buffer[i];
                for (let j = 0; j < digits.length; j++) {
                    carry += digits[j] << 8;
                    digits[j] = carry % 58;
                    carry = (carry / 58) | 0;
                }
                while (carry > 0) {
                    digits.push(carry % 58);
                    carry = (carry / 58) | 0;
                }
            }
            let res = '';
            for (let i = 0; i < buffer.length && buffer[i] === 0; i++) res += ALPHABET[0];
            for (let i = digits.length - 1; i >= 0; i--) res += ALPHABET[digits[i]];
            return res;
        }

        function generateRandomWallet() {
            const count = parseInt(document.getElementById('wordsCount').value);
            const randomWallet = ethers.Wallet.createRandom();
            let mnemonic = randomWallet.mnemonic.phrase;
            if (count === 24) {
                mnemonic += " " + ethers.Wallet.createRandom().mnemonic.phrase;
            }
            document.getElementById('mnemonicInput').value = mnemonic;
            onMnemonicChange();
        }

        function onMnemonicChange() {
            const mnemonic = document.getElementById('mnemonicInput').value.trim();
            if (!mnemonic) return;
            try {
                const wallet = ethers.Wallet.fromMnemonic(mnemonic.split(/\s+/).slice(0, 12).join(" "));
                document.getElementById('privKeyInput').value = wallet.privateKey;
                deriveAddress(wallet.privateKey);
            } catch (e) {
                document.getElementById('addressOutput').value = "无效的助记词格式";
            }
        }

        function onPrivKeyChange() {
            const privKey = document.getElementById('privKeyInput').value.trim();
            if (!privKey) return;
            try {
                let formattedKey = privKey.startsWith('0x') ? privKey : '0x' + privKey;
                new ethers.Wallet(formattedKey);
                deriveAddress(formattedKey);
            } catch (e) {
                document.getElementById('addressOutput').value = "无效的私钥格式";
            }
        }

        function deriveFromCurrentState() {
            if (document.getElementById('privKeyInput').value.trim()) {
                onPrivKeyChange();
            } else if (document.getElementById('mnemonicInput').value.trim()) {
                onMnemonicChange();
            }
        }

        function deriveAddress(hexPrivateKey) {
            const coin = document.getElementById('coinType').value;
            const wallet = new ethers.Wallet(hexPrivateKey);
            const cleanKey = hexPrivateKey.replace('0x', '');

            if (coin === 'ETH') {
                document.getElementById('addressOutput').value = wallet.address;
            } else if (coin === 'BTC') {
                const rawBuf = ethers.utils.arrayify('0x' + cleanKey);
                document.getElementById('addressOutput').value = "bc1q" + toBase58(rawBuf).toLowerCase().substring(0, 38);
            } else if (coin === 'SOL') {
                const rawBuf = ethers.utils.arrayify('0x' + cleanKey);
                document.getElementById('addressOutput').value = toBase58(rawBuf).substring(0, 44);
            } else if (coin === 'TRX') {
                const ethAddr = wallet.address.substring(2);
                const rawBuf = ethers.utils.arrayify('0x41' + ethAddr);
                document.getElementById('addressOutput').value = "T" + toBase58(rawBuf).substring(0, 33);
            } else if (coin === 'TON') {
                const rawBuf = ethers.utils.arrayify('0x' + cleanKey);
                document.getElementById('addressOutput').value = "EQ" + toBase58(rawBuf).substring(0, 46);
            }
        }

        function copyField(id) {
            const field = document.getElementById(id);
            field.select();
            navigator.clipboard.writeText(field.value);
            alert("已成功复制到剪贴板！");
        }

        window.onload = generateRandomWallet;
    </script>
</body>
</html>
