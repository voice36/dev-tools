<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator & Decoder - Fast Online Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">DevTools Express</a>
            <select onchange="location = this.value;" class="bg-blue-700 text-white text-xs py-1 px-2 rounded border border-blue-400">
                <option value="/qrcode.html" selected>🌐 English</option>
                <option value="/zh/qrcode.html">中文 (Chinese)</option>
                <option value="/ja/qrcode.html">日本語 (Japanese)</option>
            </select>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full space-y-8">
        <!-- 1. Generate QR Code -->
        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-4">
            <h1 class="text-xl font-bold border-b pb-2">1. Generate QR Code</h1>
            <input type="text" id="qrText" class="w-full p-2.5 border rounded text-sm" placeholder="Enter URL or text...">
            <button onclick="makeQR()" class="bg-blue-600 text-white px-5 py-2 rounded text-sm hover:bg-blue-700">Generate QR Code</button>
            <div id="qrcode" class="flex justify-center p-4 bg-gray-50 border rounded min-h-[160px] items-center"></div>
        </section>

        <!-- 2. Decode QR Code Image -->
        <section class="bg-white p-6 rounded-xl shadow-sm border space-y-4">
            <h2 class="text-xl font-bold border-b pb-2">2. Decode QR Code Image</h2>
            <input type="file" accept="image/*" onchange="decodeQR(event)" class="block text-sm text-gray-500">
            
            <!-- Result Display Area -->
            <div id="resultContainer" class="hidden p-4 bg-gray-50 border rounded-lg space-y-3">
                <p class="text-xs font-semibold text-gray-500">Decoded Result:</p>
                <p id="qrResultText" class="text-sm font-mono text-gray-800 break-all"></p>
                <div id="actionBtnArea"></div>
            </div>
        </section>
    </main>

    <div id="reader" class="hidden"></div>

    <script>
        function makeQR() {
            const txt = document.getElementById('qrText').value;
            if(!txt) return alert("Please enter text or URL first!");
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: txt, width: 160, height: 160 });
        }

        function decodeQR(e) {
            const file = e.target.files[0];
            if (!file) return;

            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.scanFile(file, true)
                .then(msg => {
                    const resultContainer = document.getElementById('resultContainer');
                    const qrResultText = document.getElementById('qrResultText');
                    const actionBtnArea = document.getElementById('actionBtnArea');

                    resultContainer.classList.remove('hidden');
                    qrResultText.innerText = msg;

                    if (msg.startsWith('http://') || msg.startsWith('https://')) {
                        actionBtnArea.innerHTML = `
                            <a href="${msg}" target="_blank" rel="noopener noreferrer" 
                               class="inline-block bg-green-600 text-white text-xs px-4 py-2 rounded font-medium hover:bg-green-700 transition">
                               🔗 Open Link →
                            </a>
                        `;
                    } else {
                        actionBtnArea.innerHTML = `
                            <button onclick="navigator.clipboard.writeText('${msg}'); alert('Copied to clipboard!');" 
                                    class="bg-gray-600 text-white text-xs px-4 py-2 rounded font-medium hover:bg-gray-700 transition">
                                📋 Copy Text
                            </button>
                        `;
                    }
                })
                .catch(err => {
                    alert("Failed to decode QR code. Please upload a clear image!");
                });
        }
    </script>
</body>
</html>
