<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成与识别解析器 - 极速在线工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入二维码生成库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- 引入二维码识别解析库 -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold">极速在线工具箱</a>
            <div class="text-xs sm:text-sm space-x-2 overflow-x-auto">
                <a href="json.html" class="hover:underline">JSON</a>
                <a href="base64.html" class="hover:underline">Base64</a>
                <a href="timestamp.html" class="hover:underline">时间戳</a>
                <a href="text.html" class="hover:underline">文本处理</a>
                <a href="password.html" class="hover:underline">密码生成</a>
                <a href="qrcode.html" class="font-bold underline">二维码</a>
                <a href="hash-url.html" class="hover:underline">哈希/URL</a>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full space-y-8">
        
        <!-- 1. 二维码生成区 -->
        <section class="bg-white p-6 rounded-xl shadow-sm space-y-4 border">
            <h1 class="text-xl font-bold text-gray-800 border-b pb-2">1. 在线生成二维码</h1>
            <input type="text" id="qrText" class="w-full p-3 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="输入网址(如 https://...) 或文本内容">
            <button onclick="makeQR()" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg text-sm hover:bg-blue-700 font-medium w-full sm:w-auto">生成二维码</button>
            <div id="qrcode" class="flex justify-center p-4 bg-gray-50 border rounded-lg min-h-[160px] items-center"></div>
        </section>

        <!-- 2. 二维码图片识别解析区 -->
        <section class="bg-white p-6 rounded-xl shadow-sm space-y-4 border">
            <h2 class="text-xl font-bold text-gray-800 border-b pb-2">2. 上传二维码图片识别内容</h2>
            <div class="space-y-3">
                <label class="block text-sm font-medium text-gray-700">请选择本地的二维码图片：</label>
                <input type="file" id="qrInputFile" accept="image/*" onchange="decodeQRFile(event)" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <!-- 解析结果展示框 -->
            <div id="resultBox" class="hidden p-4 bg-gray-50 border rounded-lg space-y-3 mt-4">
                <p class="text-xs text-gray-500 font-semibold">识别出的内容 / 网址：</p>
                <p id="decodedText" class="text-sm font-mono text-blue-700 font-bold break-all bg-white p-3 border rounded"></p>
                <div class="flex gap-2">
                    <button onclick="copyDecodedText()" class="bg-green-600 text-white px-4 py-1.5 rounded text-xs hover:bg-green-700 font-medium">复制结果</button>
                    <a id="openLinkBtn" href="#" target="_blank" class="hidden bg-blue-600 text-white px-4 py-1.5 rounded text-xs hover:bg-blue-700 font-medium">直接打开链接 →</a>
                </div>
            </div>
            <p id="errorMsg" class="text-sm text-red-600 font-semibold hidden"></p>
        </section>

    </main>

    <!-- 用于解析图片用的隐藏 HTML5 解码容器 -->
    <div id="reader" class="hidden"></div>

    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500">
        <a href="privacy.html" class="hover:underline">隐私政策</a> | <a href="about.html" class="hover:underline">关于本站</a>
    </footer>

    <script>
        // 生成二维码
        let qr = null;
        function makeQR() {
            const txt = document.getElementById('qrText').value.trim();
            if(!txt) return alert("请先输入内容！");
            document.getElementById('qrcode').innerHTML = "";
            qr = new QRCode(document.getElementById("qrcode"), { text: txt, width: 180, height: 180 });
        }

        // 识别解析本地二维码图片
        function decodeQRFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const resultBox = document.getElementById('resultBox');
            const decodedText = document.getElementById('decodedText');
            const errorMsg = document.getElementById('errorMsg');
            const openLinkBtn = document.getElementById('openLinkBtn');

            // 初始化或复用 html5QrCode 识别引擎
            const html5QrCode = new Html5Qrcode("reader");

            html5QrCode.scanFile(file, true)
                .then(qrCodeMessage => {
                    errorMsg.classList.add('hidden');
                    decodedText.innerText = qrCodeMessage;
                    resultBox.classList.remove('hidden');

                    // 判断是否为 URL 网址，如果是则展示“直接打开链接”按钮
                    if (qrCodeMessage.startsWith('http://') || qrCodeMessage.startsWith('https://')) {
                        openLinkBtn.href = qrCodeMessage;
                        openLinkBtn.classList.remove('hidden');
                    } else {
                        openLinkBtn.classList.add('hidden');
                    }
                })
                .catch(err => {
                    resultBox.classList.add('hidden');
                    errorMsg.innerText = "✕ 识别失败：图片中未检测到清晰的二维码，或图片格式不支持。";
                    errorMsg.classList.remove('hidden');
                });
        }

        // 复制解析出的结果
        function copyDecodedText() {
            const txt = document.getElementById('decodedText').innerText;
            navigator.clipboard.writeText(txt);
            alert("已成功复制解析结果到剪贴板！");
        }
    </script>
</body>
</html>
